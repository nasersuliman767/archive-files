
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أرشيف الاستقطاعات</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f5f4;margin:0;padding:15px;color:#222}
main{max-width:850px;margin:25px auto;background:white;padding:22px;border-radius:12px}
h1{color:#176b50}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#176b50;color:white;border:0;cursor:pointer}
button:disabled{opacity:.6}
.hidden{display:none!important}
.note{color:#666;font-size:14px}
.msg{padding:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.file{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.danger{background:#a52b2b}
</style>
</head>
<body>
<main>
<h1>أرشيف الاستقطاعات</h1>
<p class="note">حفظ الملفات والبحث عنها باسم الشخص وتصنيف الاستقطاع.</p>

<section id="auth">
<h3 id="authTitle">تسجيل الدخول</h3>
<input id="username" placeholder="اسم المستخدم" maxlength="24" autocomplete="username">
<input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="authBtn">دخول</button>
<button id="switchBtn" type="button">إنشاء حساب جديد</button>
<p id="authMsg" class="msg" aria-live="polite"></p>
</section>

<section id="archive" class="hidden">
<p id="welcome" class="note"></p>
<button id="logoutBtn">تسجيل الخروج</button>
<hr>
<h3>إضافة ملف</h3>
<input id="person" placeholder="اسم الشخص">
<select id="category">
<option value="استقطاع كفالة يتيم / أرملة">استقطاع كفالة يتيم / أرملة</option>
<option value="استقطاع عام">استقطاع عام</option>
</select>
<input id="uploadFile" type="file">
<button id="uploadBtn">حفظ الملف</button>
<p id="uploadMsg" class="msg" aria-live="polite"></p>
<hr>
<h3>البحث في الأرشيف</h3>
<input id="searchName" placeholder="ابحث باسم الشخص">
<select id="filterCategory">
<option value="">كل التصنيفات</option>
<option value="استقطاع كفالة يتيم / أرملة">استقطاع كفالة يتيم / أرملة</option>
<option value="استقطاع عام">استقطاع عام</option>
</select>
<p id="listMsg" class="note"></p>
<div id="files"></div>
</section>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://fpqmqpkeakvgddekernj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v3czIBuYsiubL-A-JQgL6w_KSs6nK9F';
const BUCKET = 'archive-documents';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let signupMode = false;
let busy = false;
let records = [];

function usernameEmail(name) {
  const normalized = name.trim().normalize('NFKC').toLowerCase();
  const bytes = new TextEncoder().encode(normalized);
  const hex = Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
  return 'u' + hex + '@archive.example.com';
}

function setBusy(value) {
  busy = value;
  ['authBtn','switchBtn','logoutBtn','uploadBtn'].forEach(id => {
    $(id).disabled = value;
  });
}

function showAuth(text='') {
  $('auth').classList.remove('hidden');
  $('archive').classList.add('hidden');
  $('authMsg').textContent = text;
}

function showArchive() {
  $('auth').classList.add('hidden');
  $('archive').classList.remove('hidden');
}

$('switchBtn').addEventListener('click', () => {
  signupMode = !signupMode;
  $('authTitle').textContent = signupMode ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
  $('authBtn').textContent = signupMode ? 'إنشاء الحساب' : 'دخول';
  $('switchBtn').textContent = signupMode ? 'العودة لتسجيل الدخول' : 'إنشاء حساب جديد';
  $('password').value = '';
  $('authMsg').textContent = '';
});

$('authBtn').addEventListener('click', async () => {
  if (busy) return;

  const username = $('username').value.trim().normalize('NFKC');
  const password = $('password').value;

  if (!username || !password) {
    $('authMsg').textContent = 'أدخل اسم المستخدم وكلمة المرور.';
    return;
  }

  if (username.length < 3 || username.length > 24) {
    $('authMsg').textContent = 'اسم المستخدم يجب أن يكون من 3 إلى 24 حرفًا.';
    return;
  }

  if (password.length < 6) {
    $('authMsg').textContent = 'كلمة المرور يجب ألا تقل عن 6 أحرف.';
    return;
  }

  setBusy(true);
  $('authMsg').textContent = signupMode ? 'جارٍ إنشاء الحساب...' : 'جارٍ تسجيل الدخول...';

  try {
    const email = usernameEmail(username);
    let error;

    if (signupMode) {
      const result = await supabase.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });
      error = result.error;

      if (!error && !result.data.session) {
        $('authMsg').textContent =
          'الحساب أُنشئ أو ينتظر التأكيد. عطّل تأكيد البريد الإلكتروني في إعدادات Supabase ثم جرّب مجددًا. إذا كان الحساب موجودًا بالفعل، ارجع لتسجيل الدخول.';
        return;
      }
    } else {
      const result = await supabase.auth.signInWithPassword({ email, password });
      error = result.error;
    }

    if (error) {
      $('authMsg').textContent = signupMode
        ? 'تعذر إنشاء الحساب. قد يكون اسم المستخدم مستخدمًا بالفعل أو إعداد المصادقة يحتاج تعديلًا.'
        : 'تعذر الدخول. تحقق من اسم المستخدم وكلمة المرور.';
      return;
    }

    $('welcome').textContent = 'المستخدم: ' + username;
    $('password').value = '';
    showArchive();
    await showFiles();
  } catch (e) {
    $('authMsg').textContent = 'تعذر الاتصال. تحقق من إعدادات المشروع والإنترنت.';
  } finally {
    setBusy(false);
  }
});

$('logoutBtn').addEventListener('click', async () => {
  if (busy) return;
  setBusy(true);
  try {
    const { error } = await supabase.auth.signOut();
    if (error) throw error;
    records = [];
    $('files').replaceChildren();
    showAuth('تم تسجيل الخروج.');
  } catch {
    alert('تعذر تسجيل الخروج.');
  } finally {
    setBusy(false);
  }
});

$('uploadBtn').addEventListener('click', async () => {
  if (busy) return;

  const person = $('person').value.trim();
  const category = $('category').value;
  const file = $('uploadFile').files[0];

  if (!person || !file) {
    $('uploadMsg').textContent = 'أدخل اسم الشخص واختر الملف.';
    return;
  }

  setBusy(true);
  $('uploadMsg').textContent = 'جارٍ حفظ الملف...';

  let path;
  let uploaded = false;

  try {
    const { data: userData, error: userError } = await supabase.auth.getUser();
    if (userError || !userData.user) throw new Error('انتهت الجلسة؛ سجّل الدخول مجددًا.');

    const safeName = file.name.replace(/[^\w.\-\u0600-\u06FF]/g, '_');
    path = userData.user.id + '/' + crypto.randomUUID() + '_' + safeName;

    const { error: uploadError } = await supabase.storage
      .from(BUCKET).upload(path, file);

    if (uploadError) throw uploadError;
    uploaded = true;

    const { error: dbError } = await supabase.from('archive_files').insert({
      person_name: person,
      category,
      file_path: path,
      file_name: file.name
    });

    if (dbError) {
      await supabase.storage.from(BUCKET).remove([path]);
      uploaded = false;
      throw dbError;
    }

    $('person').value = '';
    $('uploadFile').value = '';
    $('uploadMsg').textContent = 'تم حفظ الملف بنجاح.';
    await showFiles();
  } catch (e) {
    $('uploadMsg').textContent = 'تعذر الحفظ: ' + (e.message || 'تحقق من الجدول والصلاحيات.');
  } finally {
    setBusy(false);
  }
});

async function showFiles() {
  const container = $('files');
  container.replaceChildren();
  $('listMsg').textContent = 'جارٍ تحميل الملفات...';

  try {
    const { data: userData, error: userError } = await supabase.auth.getUser();
    if (userError || !userData.user) {
      showAuth('يرجى تسجيل الدخول.');
      return;
    }

    const { data, error } = await supabase.from('archive_files')
      .select('id,person_name,category,file_path,file_name,created_at')
      .order('created_at', { ascending: false });

    if (error) throw error;
    records = data || [];

    const term = $('searchName').value.trim().toLowerCase();
    const category = $('filterCategory').value;
    const filtered = records.filter(r =>
      (r.person_name || '').toLowerCase().includes(term) &&
      (!category || r.category === category)
    );

    $('listMsg').textContent = 'عدد الملفات: ' + filtered.length;

    if (!filtered.length) {
      container.textContent = 'لا توجد ملفات مطابقة.';
      return;
    }

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'file';

      const title = document.createElement('strong');
      title.textContent = r.person_name || 'بدون اسم';

      const detail = document.createElement('p');
      detail.textContent = (r.category || '') + ' — ' + (r.file_name || '');

      const actions = document.createElement('div');
      actions.className = 'actions';

      const open = document.createElement('button');
      open.textContent = 'فتح / تنزيل';
      open.onclick = async () => {
        try {
          const { data, error } = await supabase.storage.from(BUCKET)
            .createSignedUrl(r.file_path, 60);
          if (error) throw error;
          window.open(data.signedUrl, '_blank', 'noopener,noreferrer');
        } catch {
          alert('تعذر فتح الملف. تحقق من صلاحيات التخزين.');
        }
      };

      const del = document.createElement('button');
      del.textContent = 'حذف';
      del.className = 'danger';
      del.onclick = async () => {
        if (busy || !confirm('هل تريد حذف هذا الملف نهائيًا؟')) return;
        setBusy(true);
        try {
          const { error: storageError } = await supabase.storage.from(BUCKET)
            .remove([r.file_path]);
          if (storageError) throw storageError;

          const { error: dbError } = await supabase.from('archive_files')
            .delete().eq('id', r.id);
          if (dbError) throw dbError;

          await showFiles();
        } catch (e) {
          alert('تعذر الحذف: ' + (e.message || 'تحقق من الصلاحيات.'));
        } finally {
          setBusy(false);
        }
      };

      actions.append(open, del);
      card.append(title, detail, actions);
      container.append(card);
    });
  } catch {
    $('listMsg').textContent =
      'تعذر تحميل الملفات. تأكد من إنشاء جدول archive_files وتطبيق سياسات قاعدة البيانات والتخزين.';
  }
}

$('searchName').addEventListener('input', showFiles);
$('filterCategory').addEventListener('change', showFiles);

const { data: sessionData } = await supabase.auth.getSession();
if (sessionData.session) {
  showArchive();
  await showFiles();
}
</script>
</body>
</html>
